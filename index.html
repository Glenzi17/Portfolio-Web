<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Guilherme Lenzi — Designer Gráfico & Diretor Criativo</title>
  <meta name="description" content="Portfólio de Guilherme Lenzi: identidades visuais, campanhas publicitárias, direção de arte e experiências digitais com conceito, estética e propósito.">
  <meta name="theme-color" content="#f2f4f7">
  <meta property="og:title" content="Guilherme Lenzi — Designer Gráfico & Diretor Criativo">
  <meta property="og:description" content="Transformo ideias em identidades, experiências e soluções visuais com conceito, estética e propósito.">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

  <script>
    document.documentElement.classList.add('js');
    // O site sempre abre claro; o noturno vale só enquanto a página está aberta.
    // Apaga a escolha antiga que ficava salva (versão anterior do botão).
    document.documentElement.dataset.theme = 'light';
    try { localStorage.removeItem('gl-theme'); } catch (e) {}
    // Primeira visita da sessão: o fundo da abertura já sai no HTML, sem esperar o JS
    try {
      if (sessionStorage.getItem('gl-seen') !== '1' && !matchMedia('(prefers-reduced-motion: reduce)').matches)
        document.documentElement.classList.add('boot');
    } catch (e) {}
  </script>
  <style>
    #boot { display: none; }
    .boot #boot { display: block; position: fixed; inset: 0; z-index: 700; background: #0c1422; }
    #boot span {
      position: absolute; right: clamp(20px, 4.5vw, 72px); bottom: 40px;
      font: 500 11px/1.4 ui-monospace, "SFMono-Regular", Menlo, monospace; letter-spacing: 0.06em; color: rgba(242, 244, 247, 0.6);
    }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true"><span>000</span></div>
  <div id="root"></div>
  <noscript><p style="padding:24px;font-family:system-ui">Este portfólio precisa de JavaScript para funcionar.</p></noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
